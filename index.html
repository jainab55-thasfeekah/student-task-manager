<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5fb;
      color: #222b45;
    }

    .container {
      max-width: 650px;
      margin: 60px auto;
      padding: 30px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px #26345b12;
    }

    h1 {
      margin-bottom: 8px;
      color: #5546d8;
    }

    .subtitle {
      color: #68708a;
      margin-bottom: 25px;
    }

    .task-form {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #d9dcec;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-btn {
      background: #5546d8;
      color: white;
    }

    .stats {
      margin: 22px 0 12px;
      color: #68708a;
      font-size: 14px;
    }

    ul {
      padding: 0;
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 0;
      border-bottom: 1px solid #edf0f7;
    }

    li span {
      flex: 1;
      overflow-wrap: anywhere;
    }

    li.done span {
      text-decoration: line-through;
      color: #9299aa;
    }

    .delete-btn {
      background: #fff0f0;
      color: #c03945;
    }

    .empty {
      color: #9299aa;
      text-align: center;
      padding: 20px 0;
    }

    @media (max-width: 480px) {
      .container {
        margin: 20px 12px;
        padding: 20px;
      }

      .task-form {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>My Student Tasks 📚</h1>
    <p class="subtitle">
      Plan your day. Complete your goals.
    </p>

    <form class="task-form" id="taskForm">
      <input
        type="text"
        id="taskInput"
        placeholder="Enter your task..."
        maxlength="150"
        required
      >
      <button class="add-btn" type="submit">
        + Add Task
      </button>
    </form>

    <p class="stats" id="stats">0 tasks</p>
    <ul id="taskList"></ul>
  </main>

  <script>
    const form = document.getElementById("taskForm");
    const input = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const stats = document.getElementById("stats");

    let tasks = [];

    function saveTasks() {
      localStorage.setItem(
        "studentTasks",
        JSON.stringify(tasks)
      );
    }

    function renderTasks() {
      taskList.replaceChildren();

      const completed = tasks.filter(
        task => task.done
      ).length;

      stats.textContent =
        `${completed} of ${tasks.length} tasks completed`;

      if (tasks.length === 0) {
        const message = document.createElement("li");
        message.className = "empty";
        message.textContent = "No tasks yet. Add your first task!";
        taskList.appendChild(message);
        return;
      }

      tasks.forEach(task => {
        const item = document.createElement("li");
        item.className = task.done ? "done" : "";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute(
          "aria-label",
          "Mark task as completed"
        );

        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const label = document.createElement("span");
        label.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "Delete";

        deleteButton.addEventListener("click", () => {
          tasks = tasks.filter(
            current => current.id !== task.id
          );
          saveTasks();
          renderTasks();
        });

        item.append(checkbox, label, deleteButton);
        taskList.appendChild(item);
      });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      tasks.push({
        id: Date.now() + Math.random(),
        text: text,
        done: false
      });

      saveTasks();
      renderTasks();
      form.reset();
      input.focus();
    });

    try {
      const savedTasks = JSON.parse(
        localStorage.getItem("studentTasks") || "[]"
      );

      if (Array.isArray(savedTasks)) {
        tasks = savedTasks.filter(task =>
          task &&
          typeof task.text === "string" &&
          typeof task.done === "boolean" &&
          typeof task.id === "number"
        );
      }
    } catch (error) {
      tasks = [];
    }

    renderTasks();
  </script>
</body>
</html>
